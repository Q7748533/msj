<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>派单系统（排序测试）</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<!-- 测试页面：不连接数据库，使用本地内存数据，所有操作不影响线上 -->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #f0f2f5;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 顶栏 */
.header {
  background: #fff;
  padding: 10px 20px;
  border-bottom: 1px solid #e8e8e8;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
.header h1 { font-size: 18px; font-weight: 600; color: #1a1a1a; white-space: nowrap; }
.header .summary {
  display: flex;
  gap: 12px;
  margin-left: auto;
}
.summary-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 72px;
  padding: 6px 14px;
  border-radius: 8px;
  background: #fafafa;
  transition: all .2s;
  cursor: pointer;
}
.summary-card:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.summary-card .num { font-size: 20px; font-weight: 700; line-height: 1.2; }
.summary-card .label { font-size: 11px; color: #999; margin-top: 2px; }
.summary-card.total .num { color: #1677ff; }
.summary-card.pending .num { color: #fa8c16; }
.summary-card.done .num { color: #52c41a; }
.summary-card.cancel .num { color: #999; }
.summary-card.total { background: #e6f7ff; }
.summary-card.pending { background: #fff7e6; }
.summary-card.done { background: #f6ffed; }
.summary-card.cancel { background: #f5f5f5; }

/* 主体 */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
  gap: 0;
}

/* 左侧：粘贴区（窄） */
.sidebar {
  width: 320px;
  min-width: 320px;
  display: flex;
  flex-direction: column;
  background: #fff;
  margin: 12px 0 12px 12px;
  border-radius: 8px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  overflow: hidden;
}
.sidebar-header {
  padding: 10px 14px;
  border-bottom: 1px solid #f0f0f0;
  font-size: 13px;
  font-weight: 600;
  color: #333;
  flex-shrink: 0;
}
.sidebar-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 10px;
}
.sidebar-body textarea {
  flex: 1;
  border: 1px solid #e8e8e8;
  border-radius: 6px;
  outline: none;
  resize: none;
  padding: 10px;
  font-size: 12px;
  font-family: "Consolas", "Courier New", "Microsoft YaHei", monospace;
  line-height: 1.6;
  color: #333;
  background: #fafafa;
  transition: border-color .2s;
}
.sidebar-body textarea:focus { border-color: #1677ff; background: #fff; }
.sidebar-body textarea::placeholder { color: #bfbfbf; }
.sidebar-body .btn-row {
  display: flex;
  gap: 8px;
}
.sidebar-body .hint {
  font-size: 11px;
  color: #999;
  line-height: 1.5;
}

.btn {
  padding: 6px 14px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
  transition: all .15s;
  white-space: nowrap;
}
.btn-primary { background: #1677ff; color: #fff; flex: 1; }
.btn-primary:hover { background: #4096ff; }
.btn-danger  { background: #fff; color: #ff4d4f; border: 1px solid #ff4d4f; }
.btn-danger:hover  { background: #fff1f0; }
.btn-default { background: #fff; color: #333; border: 1px solid #d9d9d9; }
.btn-default:hover { border-color: #1677ff; color: #1677ff; }
.btn-sm { padding: 3px 8px; font-size: 12px; border-radius: 4px; }

/* 右侧：订单表格 */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #fff;
  margin: 12px;
  border-radius: 8px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  overflow: hidden;
  min-width: 0;
}
.content-header {
  padding: 10px 16px;
  border-bottom: 1px solid #f0f0f0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.content-header .title { font-size: 14px; font-weight: 600; color: #333; margin-right: 20px; }
.content-header .filter-bar { display: flex; gap: 8px; margin-right: 12px; }
.content-header .actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.search-input {
  padding: 5px 12px;
  border: 1px solid #d9d9d9;
  border-radius: 14px;
  font-size: 12px;
  outline: none;
  width: 160px;
  transition: border-color .2s;
}
.search-input:focus { border-color: #1677ff; width: 220px; }
.filter-btn {
  padding: 5px 16px;
  border-radius: 14px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 500;
  border: 1px solid #e8e8e8;
  background: #fafafa;
  color: #666;
  transition: all .2s;
}
.filter-btn:hover { border-color: #1677ff; color: #1677ff; }
.filter-btn.active { background: #1677ff; color: #fff; border-color: #1677ff; }
.fleet-select {
  padding: 5px 8px;
  border-radius: 14px;
  font-size: 12px;
  border: 1px solid #e8e8e8;
  background: #fafafa;
  color: #666;
  outline: none;
  cursor: pointer;
}
.fleet-select:focus { border-color: #1677ff; }

/* 分页 */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 14px 16px;
  border-top: 1px solid #f0f0f0;
  flex-shrink: 0;
  user-select: none;
}
.pagination .btn-page {
  padding: 6px 14px;
  border: 1px solid #d9d9d9;
  border-radius: 6px;
  background: #fff;
  color: #555;
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
  transition: all .15s;
}
.pagination .btn-page:hover:not(:disabled) { color: #1677ff; border-color: #1677ff; }
.pagination .btn-page:disabled { opacity: .35; cursor: not-allowed; color: #bbb; }
.page-num {
  min-width: 34px; height: 34px;
  padding: 0;
  text-align: center;
  border: 1px solid #d9d9d9;
  border-radius: 6px;
  background: #fff;
  color: #555;
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
  transition: all .15s;
}
.page-num:hover { color: #1677ff; border-color: #1677ff; }
.page-num.active {
  background: #1677ff;
  color: #fff;
  border-color: #1677ff;
  box-shadow: 0 2px 6px rgba(22,119,255,.25);
}
.page-info {
  font-size: 12px;
  color: #999;
  margin-left: 12px;
  padding: 6px 10px;
  background: #fafafa;
  border-radius: 6px;
}
button:disabled { opacity: .35; cursor: not-allowed; }
.content-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}

.table-wrap { 
  overflow: visible; /* 不创建滚动容器，让 th 的 sticky 相对 .content-body 生效；横向滚动由 #hscroll 控制 contentBody.scrollLeft */
}

/* 浮动水平滚动条 - 固定在视口底部，始终可见 */
.hscroll {
  height: 14px;
  overflow-x: auto;
  overflow-y: hidden;
  flex-shrink: 0;
  background: #fafafa;
  border-top: 1px solid #f0f0f0;
}
.hscroll > div {
  height: 1px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  min-width: 1500px;
}
th, td {
  padding: 7px 10px;
  text-align: left;
  border-bottom: 1px solid #f0f0f0;
  white-space: nowrap;
}
th {
  background: #fafafa;
  font-weight: 600;
  color: #555;
  position: sticky;
  top: 0;
  z-index: 1;
}
th::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  border-bottom: 1px solid #e8e8e8;
}
tr:hover td { background: #f5f8ff; }
tr.editing td { background: #e6f7ff !important; }
tr.editing td.editable { background: #bae7ff !important; }
td { max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
td.col-addr { max-width: 300px; white-space: normal; word-break: break-all; }

/* 状态标签 */
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
}
.tag-pending  { background: #fff1f0; color: #cf1322; }
.tag-done     { background: #f6ffed; color: #389e0d; }
.tag-cancel   { background: #fff1f0; color: #cf1322; }
.tag-no       { background: #fff1f0; color: #cf1322; }
.tag-yes      { background: #f6ffed; color: #389e0d; }

/* 可编辑单元格 */
.editable {
  cursor: pointer;
  border-bottom: 1px dashed #d9d9d9;
  min-width: 40px;
}
.editable:hover { background: #fffbe6; }
.editable input {
  width: 100%;
  border: 1px solid #1677ff;
  border-radius: 2px;
  padding: 2px 4px;
  font-size: 12px;
  outline: none;
  font-family: inherit;
}

/* 空状态 */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #bfbfbf;
  font-size: 14px;
}

/* 弹窗 */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.3);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
/* 密码弹窗层级更高：车队管理等弹窗内触发密码验证时不被遮挡 */
#pwdOverlay { z-index: 150; }
.modal {
  background: #fff;
  border-radius: 8px;
  padding: 20px 24px;
  min-width: 320px;
  box-shadow: 0 4px 20px rgba(0,0,0,.12);
}
.modal h3 { font-size: 15px; margin-bottom: 16px; }
.modal-options { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.modal-options .opt {
  padding: 6px 14px;
  border: 1px solid #d9d9d9;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all .15s;
}
.modal-options .opt:hover { border-color: #1677ff; color: #1677ff; }
.modal-options .opt.active { border-color: #1677ff; background: #e6f7ff; color: #1677ff; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* 密码弹窗 */
.pwd-modal input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #d9d9d9;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
  letter-spacing: 4px;
  transition: border-color .2s;
  box-sizing: border-box;
}
.pwd-modal input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,.15); }
.pwd-modal .modal-actions { margin-top: 16px; }
.pwd-error { color: #ff4d4f; font-size: 12px; margin-top: 6px; display: none; }

/* 阶段2：身份入口 */
.role-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border: 1px solid #e8e8e8;
  border-radius: 8px;
  cursor: pointer;
  transition: all .15s;
}
.role-card:hover { border-color: #1677ff; background: #f0f7ff; }
.role-icon { font-size: 24px; }
.role-card small { color: #999; }
.user-badge {
  padding: 4px 10px;
  border-radius: 12px;
  background: #e6f7ff;
  color: #1677ff;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.user-badge:hover { background: #bae0ff; }
/* 车队视图：隐藏调度专属功能 */
body.fleet-view .admin-only { display: none !important; }
/* 未登录：主体数据模糊+禁交互，防止登录层背后看到订单 */
body.pre-login .main,
body.pre-login .summary { filter: blur(8px); pointer-events: none; user-select: none; }

/* Toast 提示 */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #fff7e6;
  color: #d46b08;
  border: 1px solid #ffd591;
  padding: 12px 28px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 4px 16px rgba(250,140,22,.2);
  z-index: 300;
  opacity: 0;
  transform: translateX(-50%) translateY(-10px);
  transition: all .3s;
  pointer-events: auto;
  cursor: pointer;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast::before { content: '⚠️ '; }
.toast.success { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; box-shadow: 0 4px 16px rgba(82,196,26,.2); }
.toast.success::before { content: '✓ '; }

/* 右键菜单 */
.ctx-menu {
  position: fixed;
  background: #fff;
  border: 1px solid #e8e8e8;
  border-radius: 6px;
  box-shadow: 0 2px 12px rgba(0,0,0,.1);
  z-index: 200;
  min-width: 120px;
  overflow: hidden;
}
.ctx-item {
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
  color: #333;
}
.ctx-item:hover { background: #f5f5f5; color: #ff4d4f; }
.ctx-item.ctx-copy:hover { color: #1677ff; }
.ctx-item.ctx-current { color: #1677ff; font-weight: 600; }

/* 复选框 */
td input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; vertical-align: middle; }
th input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; vertical-align: middle; }

@media (max-width: 900px) {
  body { height: auto; min-height: 100vh; }

  /* 移动端禁用订单行长按 callout 和文本选择（input 除外），配合长按弹菜单 */
  tr[data-no] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  tr[data-no] input { -webkit-user-select: text; user-select: text; }

  /* 车队下拉框紧凑化（侧栏空间有限） */
  .fleet-select { padding: 4px 8px; font-size: 11px; }

  /* 顶栏 - 卡片缩小 */
  .header { padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
  .header h1 { font-size: 15px; }
  .summary { gap: 6px; }
  .summary-card { min-width: 54px; padding: 5px 8px; }
  .summary-card .num { font-size: 16px; }
  .summary-card .label { font-size: 10px; }

  /* 主体 - 垂直布局 */
  .main { flex-direction: column; }
  .sidebar {
    width: auto; min-width: auto;
    margin: 8px 8px 0;
    max-height: 190px; /* 含车队下拉框，适当加高保证粘贴框可用 */
  }
  .sidebar-body textarea { font-size: 14px; }
  .content { margin: 6px 8px 8px; }
  .content-header {
    padding: 8px 10px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .content-header .title { font-size: 13px; margin-right: 0; }
  .content-header .filter-bar { order: 1; width: 100%; gap: 4px; margin-right: 0; }
  .search-input { order: 2; width: 100%; margin: 4px 0; }
  .content-header .actions { order: 3; margin-left: 0; flex-wrap: wrap; }
  .filter-btn { padding: 4px 10px; font-size: 11px; }

  /* 表格 - 横向滚动 */
  table { font-size: 11px; min-width: 1200px; }
  th, td { padding: 5px 6px; }
  td input[type="checkbox"], th input[type="checkbox"] { width: 14px; height: 14px; }
  .tag { padding: 1px 5px; font-size: 10px; }

  /* 分页 - 紧凑 */
  .pagination { padding: 8px; gap: 2px; flex-wrap: wrap; }
  .pagination .btn-page { padding: 4px 8px; font-size: 11px; }
  .page-num { min-width: 26px; height: 26px; font-size: 11px; }
  .page-info { font-size: 10px; margin-left: 4px; padding: 4px 6px; }

  /* 浮动滚动条 - 紧凑 */
  .hscroll { height: 10px; }

  /* 弹窗 */
  .modal { min-width: auto; width: 90%; padding: 16px 18px; }
  .modal h3 { font-size: 14px; }
  .modal-options { gap: 6px; }
  .modal-options .opt { padding: 5px 10px; font-size: 12px; }

  /* 密码弹窗 */
  .pwd-modal input { padding: 8px 10px; font-size: 14px; }

  /* Toast */
  .toast { padding: 10px 16px; font-size: 12px; max-width: 90%; }
}

@media (max-width: 480px) {
  .header { padding: 6px 8px; }
  .header h1 { font-size: 14px; }
  .summary-card { min-width: 44px; padding: 4px 6px; border-radius: 6px; }
  .summary-card .num { font-size: 14px; }
  .summary-card .label { font-size: 9px; }
  .sidebar { max-height: 140px; }
  .sidebar-header { font-size: 12px; padding: 8px 10px; }
  .sidebar-body { padding: 6px; gap: 6px; }
  .btn { padding: 5px 10px; font-size: 12px; }
  .filter-btn { padding: 3px 8px; font-size: 10px; border-radius: 10px; }
  .search-input { font-size: 14px; padding: 8px 10px; }
  .page-num { min-width: 24px; height: 24px; font-size: 10px; }
}
</style>
</head>
<body class="pre-login">

<div class="header">
  <h1>派单系统 <span style="font-size:12px;color:#fa8c16;font-weight:400;">排序测试</span></h1>
  <span id="userBadge" class="user-badge" style="display:none;" title="点击退出登录" onclick="logoutUser()"></span>
  <button class="btn btn-default btn-sm admin-only" onclick="openFleetManager()" style="white-space:nowrap;">车队管理</button>
  <div class="summary" id="summaryBar">
    <div class="summary-card total" onclick="setFilterFromCard('all')"><span class="num" id="totalCount">0</span><span class="label">总计</span></div>
    <div class="summary-card pending" onclick="setFilterFromCard('未派')"><span class="num" id="pendingCount">0</span><span class="label">待派</span></div>
    <div class="summary-card done" onclick="setFilterFromCard('已派')"><span class="num" id="doneCount">0</span><span class="label">已派</span></div>
    <div class="summary-card cancel" onclick="setFilterFromCard('订单取消')"><span class="num" id="cancelCount">0</span><span class="label">取消</span></div>
  </div>
</div>

<div class="main">
  <!-- 左侧：粘贴入口（车队视图隐藏） -->
  <div class="sidebar admin-only">
    <div class="sidebar-header">粘贴订单数据</div>
    <div class="sidebar-body">
      <textarea id="inputArea" placeholder="从订单系统复制数据粘贴到此处&#10;多条订单请用空行分隔&#10;&#10;支持键值对格式和表格格式"></textarea>
      <select class="fleet-select" id="importFleet" style="width:100%;">
        <option value="">不分配（导入后右键手动分配）</option>
      </select>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="importOrders()">导入订单</button>
        <button class="btn btn-danger" onclick="clearInput()">清空</button>
      </div>
      <div class="btn-row">
        <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" onchange="importExcel(this)">
        <button class="btn btn-default" onclick="document.getElementById('fileInput').click()" style="flex:1">上传Excel</button>
      </div>
      <div class="hint">多条订单用<strong>空行</strong>分隔，粘贴后点击"导入订单"追加到右侧列表</div>
      <button class="btn btn-default" onclick="resetTestData()" title="数据存在本浏览器 localStorage，重置恢复初始状态" style="width:100%;">重置测试数据</button>
    </div>
  </div>

  <!-- 右侧：订单管理 -->
  <div class="content">
    <div class="content-header">
      <span class="title">订单列表</span>
      <div class="filter-bar">
        <button class="btn btn-sm filter-btn active" onclick="setFilter('all', this)">全部</button>
        <button class="btn btn-sm filter-btn" onclick="setFilter('未派', this)">未派</button>
        <button class="btn btn-sm filter-btn" onclick="setFilter('已派', this)">已派</button>
        <button class="btn btn-sm filter-btn" onclick="setFilter('订单取消', this)">订单取消</button>
        <select class="fleet-select" id="fleetFilter" onchange="setFleetFilter(this.value)">
          <option value="all">全部车队</option>
          <option value="__none__">未分配</option>
        </select>
      </div>
      <input type="text" class="search-input" id="searchInput" placeholder="搜索订单号/司机/车号..." oninput="doSearch()">
      <div class="actions">
        <button class="btn btn-default btn-sm" onclick="exportCSV()">导出CSV</button>
        <button class="btn btn-default btn-sm admin-only" onclick="openBatchFleet()">批量分配</button>
        <button class="btn btn-danger btn-sm admin-only" onclick="batchDelete()">批量删除</button>
        <button class="btn btn-danger btn-sm admin-only" onclick="clearOrders()">清空列表</button>
      </div>
    </div>
    <div class="content-body" id="tableArea">
      <div class="empty-state">

// 订单排序：已派+取消按服务时间升序在前，未派按导入顺序(id)在后
// 业务逻辑：新订单导入为未派→排末尾集中处理；分配司机变已派→按服务时间归位；
// 已派订单改为取消→仍按服务时间留在原位（避免跳到列表最后导致看漏）
function sortOrders(list) {
  return [...list].sort((a, b) => {
    // 已派 + 订单取消：按服务日期升序（取消保持取消前的时间位置）
    const aSorted = a['派单情况'] === '已派' || a['派单情况'] === '订单取消';
    const bSorted = b['派单情况'] === '已派' || b['派单情况'] === '订单取消';
    if (aSorted && bSorted) {
      // 格式 YYYY-MM-DD HH:MM:SS 可直接字符串比较；空日期按 id 兜底排末尾
      const aDate = a['服务日期'] || '';
      const bDate = b['服务日期'] || '';
      if (aDate && bDate) return aDate.localeCompare(bDate);
      if (aDate) return -1;  // a有日期排前
      if (bDate) return 1;   // b有日期排前
      return (a.id || 0) - (b.id || 0);  // 都空按id
    }
    if (aSorted) return -1;  // 已派/取消排前
    if (bSorted) return 1;
    // 未派：按导入顺序(id)
    return (a.id || 0) - (b.id || 0);
  });
}

async function loadOrders() {
  const supabase = getSupabase();
  if (!supabase) { setTimeout(loadOrders, 300); return; }
  let allOrders = [];
  let start = 0;
  const limit = 1000;
  let hasError = false;
  while (true) {
    const { data, error } = await supabase
      .from('orders')
      .select('*', { count: 'exact' })
      .order('id', { ascending: true })
      .range(start, start + limit - 1);
    if (error) { console.error('加载失败:', error); hasError = true; break; }
    if (!data || data.length === 0) break;
    allOrders = allOrders.concat(data);
    if (data.length < limit) break;
    start += limit;
  }
  if (hasError) {
    showToast('数据加载失败，请检查网络');
    return;
  }
  orders = sortOrders(allOrders);
  renderTable();
}

function setupRealtime() {

      () => {

}

};

// ============ 解析逻辑 ============
function mapOrder(raw) {
  const order = defaultOrder();
  for (const [rawKey, val] of Object.entries(raw)) {
    const mappedKey = FIELD_MAP[rawKey];
    if (mappedKey && val) {
      order[mappedKey] = val;
    }
  }
  // 服务城市（Excel 已有值时保留，否则默认成都）
  if (!order['服务城市']) {
    order['服务城市'] = '成都';
  }

  // 车队不做自动分配：车队与车型无关，由管理员导入时选择或右键手动分配

  // 清洗地址：去掉坐标 (纬度：... 经度：...)
  function cleanAddress(addr) {
    return addr.replace(/\(纬度[^)]*\)\s*/, '').trim();
  }

  // 根据服务类型决定上车点/下车点（仅当数据来自原始订单系统格式时）
  // 判定：原始数据含"机场/高铁"或"航站楼"字段时，需要重新计算上下车点
  const isRawFormat = raw['机场/高铁'] || raw['航站楼'] || raw['上（下）车点'];
  if (isRawFormat) {
    const serviceType = order['服务类型'];
    const airport = raw['机场/高铁'] || '';
    const terminal = raw['航站楼'] || '';
    const address = cleanAddress(order['上车点']); // 暂存原始上（下）车点

    if (serviceType.includes('接机')) {
      order['上车点'] = [airport, terminal].filter(Boolean).join(' ');
      order['下车点'] = address;
    } else if (serviceType.includes('送机')) {
      order['上车点'] = address;
      order['下车点'] = [airport, terminal].filter(Boolean).join(' ');
    } else {
      order['上车点'] = cleanAddress(order['上车点']);
      order['下车点'] = cleanAddress(order['下车点']);
    }
  }

  return order;
}

function isKeyValueFormat(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  if (lines.length === 0) return false;
  const kvLines = lines.filter(l => /[：:]/.test(l));
  return kvLines.length / lines.length >= 0.5;
}

function parseKeyValue(text) {
  const blocks = text.split(/\n\s*\n/).filter(b => b.trim());
  const result = [];
  for (const block of blocks) {
    const lines = block.trim().split('\n');
    const raw = {};
    for (const line of lines) {
      const m = line.trim().match(/^(.+?)[：:]\s*(.*)$/);
      if (m) {
        const key = m[1].trim();
        const val = m[2].trim();
        raw[key] = (raw[key] !== undefined) ? raw[key] + '；' + val : val;
      }
    }
    if (Object.keys(raw).length > 0) result.push(raw);
  }
  return result;
}

function parseTabular(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  let delimiter = '\t';
  let bestScore = 0;
  for (const d of ['\t', ',', ';', '|']) {
    const counts = lines.slice(0, Math.min(lines.length, 5)).map(l => l.split(d).length);
    if (counts.every(c => c === counts[0] && c > 1) && counts[0] > bestScore) {
      delimiter = d; bestScore = counts[0];
    }
  }
  const headers = lines[0].split(delimiter).map(c => c.trim());
  return lines.slice(1).map(l => {
    const vals = l.split(delimiter).map(c => c.trim());
    const raw = {};
    headers.forEach((h, i) => { raw[h] = vals[i] || ''; });
    return raw;
  });
}

// ============ 导入 ============
function importOrders() {
  if (isFleet()) return; // 车队视图无导入权限
  verifyPassword(function(ok) {
    if (!ok) return;
    doImportOrders();
  });
}

function doImportOrders() {
  if (!getSupabase()) { alert('数据库未连接，请检查 API Key'); return; }
  const input = document.getElementById('inputArea').value.trim();
  if (!input) return;

  const rawList = isKeyValueFormat(input) ? parseKeyValue(input) : parseTabular(input);
  if (rawList.length === 0) return;

  // 去重：按订单号跳过已存在的；车队按导入下拉框选择（''=不分配 / 车队名=指定）
  const importFleet = document.getElementById('importFleet').value;
  const existingNos = new Set(orders.map(o => o['订单号']));
  const newOrders = [];
  let dupCount = 0;
  for (const raw of rawList) {
    const order = mapOrder(raw);
    order['车队'] = importFleet; // 原始数据无车队概念，统一按导入选择
    if (!order['订单号']) continue;
    if (existingNos.has(order['订单号'])) { dupCount++; continue; }
    newOrders.push(order);
    existingNos.add(order['订单号']);
  }

  if (newOrders.length > 0) {
    getSupabase().from('orders').upsert(newOrders, { onConflict: '订单号' }).then(({ error }) => {
      if (error) { alert('导入失败: ' + error.message); return; }
      loadOrders();
      document.getElementById('inputArea').value = '';
      showSuccess(dupCount > 0
        ? `成功导入 ${newOrders.length} 条，跳过 ${dupCount} 条重复订单`
        : `成功导入 ${newOrders.length} 条订单`);
    });
  } else {
    alert(dupCount > 0 ? `没有新订单导入（${dupCount} 条重复）` : '没有新订单导入（订单号为空）');
  }
}

function clearInput() {
  document.getElementById('inputArea').value = '';
}

// ============ Excel导入 ============
function importExcel(fileInput) {
  if (isFleet()) { fileInput.value = ''; return; } // 车队视图无导入权限
  verifyPassword(function(ok) {
    if (!ok) { fileInput.value = ''; return; }
    doImportExcel(fileInput);
  });
}

function doImportExcel(fileInput) {
  const file = fileInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
    if (rows.length < 2) { fileInput.value = ''; return; }

    const headers = rows[0].map(h => String(h || '').trim());
    // 车队按导入下拉框选择（''=不分配 / 车队名=指定）
    const importFleet = document.getElementById('importFleet').value;
    const existingNos = new Set(orders.map(o => o['订单号']));
    const newOrders = [];
    let dupCount = 0;

    for (let i = 1; i < rows.length; i++) {
      const raw = {};
      headers.forEach((h, j) => { raw[h] = rows[i][j] != null ? String(rows[i][j]).trim() : ''; });
      const order = mapOrder(raw);
      order['车队'] = importFleet; // 原始数据无车队概念，统一按导入选择
      if (!order['订单号']) continue;
      if (existingNos.has(order['订单号'])) { dupCount++; continue; }
      newOrders.push(order);
      existingNos.add(order['订单号']);
    }

    if (newOrders.length > 0) {
      getSupabase().from('orders').upsert(newOrders, { onConflict: '订单号' }).then(({ error }) => {
        if (error) { alert('导入失败: ' + error.message); return; }
        loadOrders();
        fileInput.value = ''; // 仅在导入成功后清空，失败时保留供重试
        showSuccess(dupCount > 0
          ? `成功导入 ${newOrders.length} 条，跳过 ${dupCount} 条重复订单`
          : `成功导入 ${newOrders.length} 条订单`);
      });
    } else {
      alert(dupCount > 0 ? `没有新订单导入（${dupCount} 条重复）` : '没有新订单导入（订单号为空）');
      fileInput.value = ''; // 没有新订单也清空（重试无意义）
    }
  };
  reader.readAsArrayBuffer(file);
}

// ============ 筛选 ============
const SEARCH_FIELDS = ['订单号', '车队', '司机', '车号', '司机电话', '上车点', '下车点', '服务类型'];

// 统一筛选+搜索逻辑（renderTable / goPage / getNextEditableCell / exportCSV 共用）
function getFilteredOrders() {
  let filtered = filterStatus === 'all' ? orders : orders.filter(o => o['派单情况'] === filterStatus);
  // 车队筛选（'__none__' = 未分配）
  if (fleetFilter !== 'all') {
    filtered = filtered.filter(o => fleetFilter === '__none__' ? !o['车队'] : o['车队'] === fleetFilter);
  }
  if (searchTerm) {
    const kw = searchTerm.toLowerCase();
    filtered = filtered.filter(o => SEARCH_FIELDS.some(f => o[f] && o[f].toLowerCase().includes(kw)));
  }
  return filtered;
}

function setFilter(status, btn) {
  filterStatus = status;
  currentPage = 1;

// ============ 车队管理 ============
let fleets = []; // 车队列表（从数据库加载，管理界面可增删）

// 从 Supabase(fleets 表) 加载车队列表（含车队登录密码）
async function loadFleets() {
  const supabase = getSupabase();
  if (!supabase) { setTimeout(loadFleets, 300); return; }
  const { data, error } = await supabase.from('fleets').select('*').order('id', { ascending: true });
  if (error) { console.error('车队加载失败:', error); return; }
  fleets = (data || []).map(r => r['名称']).filter(Boolean);
  fleetPws = {};
  (data || []).forEach(r => { if (r['名称']) fleetPws[r['名称']] = r['密码'] || ''; });
  refreshFleetUI();
  // 车队视图失效保护：登录中的车队被删后强制重新登录
  if (isFleet() && userFleet && !fleets.includes(userFleet)) {
    alert(`车队「${userFleet}」已不存在，请重新登录`);
    sessionStorage.removeItem('msj_session');
    location.reload();
  }
}

// 车队列表变化后刷新所有相关 UI（筛选下拉框/导入下拉框/管理列表）
function refreshFleetUI() {
  // 筛选下拉框（保留当前选择，失效则回退全部）
  const sel = document.getElementById('fleetFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">全部车队</option><option value="__none__">未分配</option>';
  fleets.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f; opt.textContent = f;
    sel.appendChild(opt);
  });
  sel.value = isFleet() ? userFleet : ((cur === 'all' || cur === '__none__' || fleets.includes(cur)) ? cur : 'all');
  // 导入下拉框（保留当前选择，失效则回退不分配）
  const importSel = document.getElementById('importFleet');
  const curImp = importSel.value;
  importSel.innerHTML = '<option value="">不分配（导入后右键手动分配）</option>';
  fleets.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f; opt.textContent = f;
    importSel.appendChild(opt);
  });
  importSel.value = fleets.includes(curImp) ? curImp : '';
  // 管理列表（弹窗打开时刷新）
  renderFleetList();
}

function openFleetManager() {
  if (isFleet()) return; // 车队视图无车队管理权限
  renderFleetList();
  document.getElementById('fleetOverlay').classList.add('show');
}

function closeFleetModal() {

// 渲染管理列表：车队名 + 订单数 + 登录密码 + 删除按钮
function renderFleetList() {
  const list = document.getElementById('fleetList');
  if (!list) return;
  if (fleets.length === 0) {
    list.innerHTML = '<div style="color:#999;font-size:13px;text-align:center;padding:12px;">暂无车队，请在下方添加</div>';
    return;
  }
  list.innerHTML = fleets.map(f => {
    const count = orders.filter(o => o['车队'] === f).length;
    const pwTip = fleetPws[f] ? '密码 ' + esc(fleetPws[f]) : '<span style="color:#d46b08;">未设密码（无法车队登录）</span>';
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid #f0f0f0;border-radius:6px;margin-bottom:6px;">
      <span style="font-size:13px;font-weight:500;">${esc(f)}<span style="color:#999;font-weight:400;font-size:12px;margin-left:6px;">${count} 条订单 · ${pwTip}</span></span>
      <button class="btn btn-danger btn-sm" onclick="deleteFleet('${escJs(f)}')">删除</button>
    </div>`;
  }).join('');

// 添加车队（需密码；可同时设置车队登录密码）
function addFleet() {
  if (isFleet()) return; // 车队视图无添加权限
  const input = document.getElementById('newFleetName');
  const pwdInput = document.getElementById('newFleetPwd');
  const name = input.value.trim();
  const pwd = pwdInput.value.trim();
  if (!name) { alert('请输入车队名称'); return; }
  if (fleets.includes(name)) { alert('车队「' + name + '」已存在'); return; }
  if (pwd && Object.values(fleetPws).includes(pwd)) { alert('该密码已被其他车队使用，请更换'); return; }
  verifyPassword(function(ok) {
    if (!ok) return;
    getSupabase().from('fleets').insert({ 名称: name, 密码: pwd }).then(({ error }) => {
      if (error) { alert('添加失败: ' + error.message); return; }
      input.value = '';
      pwdInput.value = '';
      loadFleets();
      showSuccess(`车队「${name}」已添加`);
    });
  });
}

// 删除车队（有订单时阻止；需密码）
function deleteFleet(name) {
  if (isFleet()) return; // 车队视图无删除权限
  const count = orders.filter(o => o['车队'] === name).length;
  if (count > 0) { alert(`车队「${name}」下还有 ${count} 条订单，请先重新分配或删除订单`); return; }
  if (!confirm(`确定删除车队「${name}」？`)) return;
  verifyPassword(function(ok) {
    if (!ok) return;
    getSupabase().from('fleets').delete().eq('名称', name).then(({ error }) => {
      if (error) { alert('删除失败: ' + error.message); return; }
      loadFleets();
      showSuccess(`车队「${name}」已删除`);
    });
  });
}

// ============ 阶段2：身份入口（调度/车队）============
// 方案A客户端过滤：车队密码进入后前端锁定只显示本车队订单（非数据库层隔离）
let userRole = null;   // null=未登录 / 'admin'=调度 / 'fleet'=车队
let userFleet = '';    // 车队视图时的车队名
let loginRole = null;  // 登录层正在操作的角色选择
let fleetPws = {};     // 车队名→登录密码（loadFleets 从 fleets 表加载）

function isFleet() { return userRole === 'fleet'; }

// 权限判断：车队视图只能编辑 车号/司机/司机电话（派单情况/是否结算仅调度可改）
function canEditField(field) {
  if (!isFleet()) return true;
  return EDITABLE_FIELDS.includes(field);
}

// 登录校验（纯函数）：调度密码888；车队按密码反查唯一车队（密码唯一由添加时校验保证）
function checkLogin(role, pwd) {
  if (role === 'admin') return pwd === '888';
  if (role === 'fleet') return !!resolveFleetByPwd(pwd);
  return false;
}

// 密码 → 车队名（密码唯一时结果唯一；空密码/未匹配返回空字符串）
function resolveFleetByPwd(pwd) {
  if (!pwd) return '';
  for (const f of fleets) {
    if (fleetPws[f] === pwd) return f;
  }
  return '';
}

// 登录层：选择角色后展示对应表单（调度输888；车队只输密码，系统自动识别车队）
function pickRole(role) {
  loginRole = role;
  document.getElementById('rolePick').style.display = 'none';
  document.getElementById('loginForm').style.display = '';
  document.getElementById('loginTitle').textContent = role === 'admin' ? '调度登录' : '车队登录';
  document.getElementById('loginError').style.display = 'none';
  const pwdEl = document.getElementById('loginPwd');
  pwdEl.placeholder = role === 'admin' ? '请输入调度密码' : '请输入本车队登录密码';
  setTimeout(() => pwdEl.focus(), 50);
}

function backRolePick() {
  loginRole = null;
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('rolePick').style.display = '';
  document.getElementById('loginTitle').textContent = '选择身份进入';
}

function doLogin() {
  const pwdEl = document.getElementById('loginPwd');
  const pwd = pwdEl.value;
  if (checkLogin(loginRole, pwd)) {
    userRole = loginRole;
    userFleet = loginRole === 'fleet' ? resolveFleetByPwd(pwd) : '';
    pwdEl.value = '';
    document.getElementById('loginError').style.display = 'none';
    enterApp();
  } else {
    document.getElementById('loginError').style.display = 'block';
    pwdEl.value = '';
    pwdEl.focus();
  }
}

function enterApp() {
  sessionStorage.setItem('msj_session', JSON.stringify({ role: userRole, fleet: userFleet }));
  document.getElementById('loginOverlay').classList.remove('show');
  applyRoleView();
}

// 按身份切换视图：车队视图锁定车队筛选+隐藏调度专属功能（CSS admin-only）
function applyRoleView() {
  document.body.classList.remove('pre-login'); // 登录成功解除数据模糊
  const sel = document.getElementById('fleetFilter');
  if (isFleet()) {
    document.body.classList.add('fleet-view');
    fleetFilter = userFleet;
    sel.value = userFleet;
    sel.disabled = true;
    currentPage = 1;
  } else {
    document.body.classList.remove('fleet-view');
    sel.disabled = false;
  }
  updateUserBadge();
  renderTable();
}

function updateUserBadge() {
  const badge = document.getElementById('userBadge');
  if (!badge) return;
  if (userRole === 'admin') { badge.textContent = '调度'; badge.style.display = ''; }
  else if (userRole === 'fleet') { badge.textContent = userFleet + ' · 车队'; badge.style.display = ''; }
  else badge.style.display = 'none';
}

function logoutUser() {
  if (!confirm('确定退出当前身份？')) return;
  sessionStorage.removeItem('msj_session');
  location.reload();
}

// 刷新页面恢复上次登录身份（会话存 sessionStorage，关标签页即失效）
function restoreSession() {
  try {
    const saved = JSON.parse(sessionStorage.getItem('msj_session') || 'null');
    if (saved && (saved.role === 'admin' || saved.role === 'fleet')) {
      userRole = saved.role;
      userFleet = saved.fleet || '';
      document.getElementById('loginOverlay').classList.remove('show');
      applyRoleView();
    }
  } catch (e) { /* 损坏的会话忽略，走登录层 */ }
}

function setFilterFromCard(status) {

  btns.forEach(b => {
    const label = b.textContent.trim();

    b.classList.toggle('active', match);

let searchTimer;
function doSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchTerm = document.getElementById('searchInput').value.trim();
    currentPage = 1;
    renderTable();
  }, 250);
}

// ============ 渲染 ============
function renderTable() {
  const container = document.getElementById('tableArea');

  // 筛选后的订单
  let filtered = getFilteredOrders();
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageOrders = filtered.slice(start, start + PAGE_SIZE);

  if (orders.length === 0) {
    container.innerHTML = '<div class="empty-state"><div style="font-size:40px;margin-bottom:10px;">📋</div><div>暂无订单，请在左侧粘贴数据后导入</div></div>';
    updateSummary();
    return;
  }

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><div style="font-size:40px;margin-bottom:10px;">📋</div><div>当前筛选条件下无订单</div></div>';
    updateSummary();
    return;
  }

  let html = '<div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" title="全选"></th><th>#</th>';
  COLUMNS.forEach(c => { html += `<th>${c}</th>`; });
  html += '</tr></thead><tbody>';

  pageOrders.forEach((o, displayIdx) => {
    const orderNo = o['订单号'];
    html += `<tr data-no="${esc(orderNo)}" oncontextmenu="showCtxMenu(event, '${escJs(orderNo)}')">`;
    html += `<td><input type="checkbox" class="row-check" data-no="${esc(orderNo)}" onclick="event.stopPropagation()"></td>`;
    html += `<td>${start + displayIdx + 1}</td>`;
    COLUMNS.forEach(col => {
      const val = o[col] || '';
      if (col === '车队') {
        // 车队列：空值显示灰色"未分配"提示（右键可分配）
        html += `<td>${esc(val) || '<span style="color:#d46b08;">未分配</span>'}</td>`;
      } else if (col === '派单情况') {
        const cls = val === '已派' ? 'tag-done' : val === '订单取消' ? 'tag-cancel' : 'tag-pending';
        html += `<td><span class="tag ${cls}" onclick="event.stopPropagation();openModal('${escJs(orderNo)}', '派单情况')">${esc(val)}</span></td>`;
      } else if (col === '是否结算') {
        const cls = val === '是' ? 'tag-yes' : 'tag-no';
        html += `<td><span class="tag ${cls}" onclick="event.stopPropagation();openModal('${escJs(orderNo)}', '是否结算')">${esc(val)}</span></td>`;
      } else if (['车号', '司机', '司机电话', '下车点'].includes(col)) {
        const addrCls = col === '下车点' ? ' col-addr' : '';
        html += `<td class="editable${addrCls}" onclick="event.stopPropagation();editCell('${escJs(orderNo)}', '${col}', this)">${esc(val) || '<span style="color:#ccc">点击填写</span>'}</td>`;
      } else if (col === '上车点' || col === '服务标准' || col === '举牌服务') {
        html += `<td class="col-addr" title="${esc(val)}">${esc(val)}</td>`;
      } else {
        html += `<td title="${esc(val)}">${esc(val)}</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  // 分页
  if (totalPages > 1) {
    html += '<div class="pagination">';
    html += `<button class="btn-page" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&lt; 上一页</button>`;
    const maxShow = 7;
    let pStart = Math.max(1, currentPage - 3);
    let pEnd = Math.min(totalPages, pStart + maxShow - 1);
    if (pEnd - pStart < maxShow - 1) pStart = Math.max(1, pEnd - maxShow + 1);
    for (let p = pStart; p <= pEnd; p++) {
      html += `<button class="page-num${p === currentPage ? ' active' : ''}" onclick="goPage(${p})">${p}</button>`;
    }
    html += `<button class="btn-page" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页 &gt;</button>`;
    html += `<span class="page-info">${filtered.length} 条 / 共 ${totalPages} 页</span>`;
    html += '</div>';
  }

  container.innerHTML = html;
  updateSummary();
  checkDriverReady();
  syncHScroll();
}

function goPage(page) {
  const filtered = getFilteredOrders();
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
  currentPage = Math.max(1, Math.min(page, totalPages));
  renderTable();
}

function updateSummary() {
  // 车队视图只统计本车队订单（避免向车队泄露其他车队数据量）
  const base = isFleet() ? orders.filter(o => o['车队'] === userFleet) : orders;
  document.getElementById('totalCount').textContent = base.length;
  document.getElementById('pendingCount').textContent = base.filter(o => o['派单情况'] === '未派').length;
  document.getElementById('doneCount').textContent = base.filter(o => o['派单情况'] === '已派').length;
  document.getElementById('cancelCount').textContent = base.filter(o => o['派单情况'] === '订单取消').length;
}

// ============ 编辑 ============
let modalTarget = null;

function findOrderByNo(orderNo) {
  return orders.find(o => o['订单号'] === orderNo);
}

// 获取当前页可编辑单元格的下一个目标（Tab/Shift+Tab 跳转用）
function getNextEditableCell(orderNo, field, reverse) {
  const filtered = getFilteredOrders();
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageOrders = filtered.slice(start, start + PAGE_SIZE);

  let fieldIdx = EDITABLE_FIELDS.indexOf(field);
  if (fieldIdx === -1) return null;

  let orderIdx = pageOrders.findIndex(o => o['订单号'] === orderNo);
  if (orderIdx === -1) return null;

  if (reverse) {
    fieldIdx--;
    if (fieldIdx < 0) {
      fieldIdx = EDITABLE_FIELDS.length - 1;
      orderIdx--;
      if (orderIdx < 0) return null;
    }
  } else {
    fieldIdx++;
    if (fieldIdx >= EDITABLE_FIELDS.length) {
      fieldIdx = 0;
      orderIdx++;
      if (orderIdx >= pageOrders.length) return null;
    }
  }

  return {
    orderNo: pageOrders[orderIdx]['订单号'],
    field: EDITABLE_FIELDS[fieldIdx]
  };
}

// 按 订单号 + 字段名 定位单元格 DOM
function findCellElement(orderNo, field) {
  const trs = document.querySelectorAll('tr[data-no]');
  for (const tr of trs) {
    if (tr.getAttribute('data-no') === orderNo) {
      const cells = tr.querySelectorAll('td');
      const colIdx = COLUMNS.indexOf(field);
      if (colIdx === -1) return null;
      return cells[colIdx + 2]; // +2 因为前两列是 checkbox 和 #
    }
  }
  return null;
}

// Tab 跳转：打开下一个可编辑单元格
function jumpToTabTarget() {
  if (!tabJumpTarget) return;
  const target = tabJumpTarget;
  tabJumpTarget = null;
  const td = findCellElement(target.orderNo, target.field);
  if (td) {
    editCell(target.orderNo, target.field, td);
  }
}

function openModal(orderNo, field) {
  if (!canEditField(field)) return; // 车队视图：派单情况/是否结算仅调度可改
  modalTarget = { orderNo, field };
  const overlay = document.getElementById('modalOverlay');
  const title = document.getElementById('modalTitle');
  const optsDiv = document.getElementById('modalOptions');
  const order = findOrderByNo(orderNo);
  if (!order) { alert('订单不存在'); return; }

  if (field === '派单情况') {
    title.textContent = '修改派单状态';
    const options = ['未派', '已派', '订单取消'];
    const current = order[field];
    optsDiv.innerHTML = options.map(o =>
      `<div class="opt${o === current ? ' active' : ''}" onclick="selectOpt(this, '${o}')">${o}</div>`
    ).join('');
  } else if (field === '是否结算') {
    title.textContent = '修改结算状态';
    const options = ['是', '否'];
    const current = order[field];
    optsDiv.innerHTML = options.map(o =>
      `<div class="opt${o === current ? ' active' : ''}" onclick="selectOpt(this, '${o}')">${o}</div>`
    ).join('');
  }

  overlay.classList.add('show');
}

let selectedOptValue = '';

function selectOpt(el, val) {
  el.parentElement.querySelectorAll('.opt').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  selectedOptValue = val;
}

function confirmModal() {
  if (!modalTarget || !selectedOptValue) { closeModal(); return; }
  const field = modalTarget.field;
  const orderNo = modalTarget.orderNo;
  getSupabase().from('orders').update({ [field]: selectedOptValue }).eq('订单号', orderNo).then(({ error }) => {
    if (error) { alert('保存失败: ' + error.message); return; }
    loadOrders();
  });
  closeModal();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  modalTarget = null;
  selectedOptValue = '';
}

function editCell(orderNo, field, td) {
  if (!canEditField(field)) return; // 车队视图：仅可编辑 车号/司机/司机电话
  const order = findOrderByNo(orderNo);
  if (!order) return;
  const current = order[field] || '';
  const input = document.createElement('input');
  input.value = current;
  isEditing = true;
  let editCancelled = false; // 取消标志：Escape 时不保存
  const tr = td.closest('tr');
  if (tr) tr.classList.add('editing'); // 整行高亮

  // 局部恢复单元格显示，避免 renderTable() 重建表格导致滚动跳动和正在编辑的其他单元格被销毁
  function restoreCell(val) {
    td.innerHTML = val ? esc(val) : '<span style="color:#ccc">点击填写</span>';
    if (tr) tr.classList.remove('editing');
  }

  input.addEventListener('blur', () => {
    isEditing = false;
    if (editCancelled) {
      restoreCell(current);
      tabJumpTarget = null;
      return; // Escape 触发的 blur 不保存
    }
    const newVal = input.value.trim();
    if (newVal === current) {
      restoreCell(current); // 值未改变，只恢复显示
      jumpToTabTarget(); // Tab 跳转
      return;
    }
    restoreCell(newVal); // 先显示新值，避免视觉跳动
    getSupabase().from('orders').update({ [field]: newVal }).eq('订单号', orderNo).then(({ error }) => {
      if (error) {
        alert('保存失败: ' + error.message);
        restoreCell(current); // 失败时恢复原值
        tabJumpTarget = null;
        return;
      }
      // 局部更新：只更新本地数据，不调用 loadOrders() 避免表格重建
      order[field] = newVal;
      updateSummary();
      checkDriverReady();
      jumpToTabTarget(); // Tab 跳转
    });
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      input.blur();
    } else if (e.key === 'Escape') {
      editCancelled = true;
      isEditing = false;
      tabJumpTarget = null;
      input.blur();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      tabJumpTarget = getNextEditableCell(orderNo, field, e.shiftKey); // 可能为 null（到边界）
      input.blur();
    }
  });

  td.textContent = '';
  td.appendChild(input);
  input.focus();
}

function checkDriverReady() {
  // 统计未派且司机信息齐全的订单数量（车队视图只统计本车队）
  const base = isFleet() ? orders.filter(o => o['车队'] === userFleet) : orders;
  const readyCount = base.filter(o =>
    o['派单情况'] === '未派' && o['车号'] && o['司机'] && o['司机电话']
  ).length;
  if (readyCount > 0) {
    showToast(`${readyCount} 条未派订单已安排司机接单，请及时派单！`);
  } else {
    hideToast();
  }
}

// ============ Toast ============
let toastLock = false; // success 提示显示期间锁定，防止被 checkDriverReady 的派单提醒覆盖

function showToast(msg) {
  if (toastLock) return; // success 显示中，跳过
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show';
}

// 成功提示：绿色样式，3 秒后自动消失，期间锁定不被派单提醒覆盖
let successTimer = null;
function showSuccess(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show success';
  toastLock = true;
  if (successTimer) clearTimeout(successTimer); // 清除前一次 timer，避免提前关闭
  successTimer = setTimeout(() => {
    toast.className = 'toast';
    toastLock = false;
    successTimer = null;
    checkDriverReady(); // 恢复派单提醒状态
  }, 3000);
}

function hideToast() {
  if (toastLock) return;
  document.getElementById('toast').className = 'toast';
}

// ============ 密码验证 ============
let pwdCallback = null;

function verifyPassword(callback) {
  pwdCallback = callback;
  document.getElementById('pwdInput').value = '';
  document.getElementById('pwdError').style.display = 'none';
  document.getElementById('pwdOverlay').classList.add('show');
  setTimeout(() => document.getElementById('pwdInput').focus(), 100);
}

function confirmPwd() {
  const pwd = document.getElementById('pwdInput').value;
  if (pwd === '888') {
    document.getElementById('pwdOverlay').classList.remove('show');
    if (pwdCallback) { const cb = pwdCallback; pwdCallback = null; cb(true); }
  } else {
    document.getElementById('pwdError').style.display = 'block';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
  }
}

function cancelPwd() {
  document.getElementById('pwdOverlay').classList.remove('show');
  if (pwdCallback) { const cb = pwdCallback; pwdCallback = null; cb(false); }
}

// ============ 删除 / 清空 ============

function deleteOrder(orderNo) {
  if (isFleet()) return; // 车队视图无删除权限
  if (!confirm(`确定删除订单 ${orderNo}？`)) return;
  verifyPassword(function(ok) {
    if (!ok) return;
    getSupabase().from('orders').delete().eq('订单号', orderNo).then(({ error }) => {
      if (error) { alert('删除失败: ' + error.message); return; }
      loadOrders();
    });
  });
}

function toggleSelectAll(el) {
  document.querySelectorAll('.row-check').forEach(cb => { cb.checked = el.checked; });
}

function getSelectedOrderNos() {
  const cbs = document.querySelectorAll('.row-check:checked');
  return Array.from(cbs).map(cb => cb.getAttribute('data-no'));
}

function batchDelete() {
  if (isFleet()) return; // 车队视图无删除权限
  const nos = getSelectedOrderNos();
  if (nos.length === 0) { alert('请先勾选要删除的订单'); return; }
  if (!confirm(`确定删除选中的 ${nos.length} 条订单？`)) return;
  verifyPassword(async function(ok) {
    if (!ok) return;
    const { error } = await getSupabase().from('orders').delete().in('订单号', nos);
    if (error) { alert('删除失败: ' + error.message); return; }
    loadOrders();
  });
}

// ============ 批量分配车队 ============
// 打开弹窗：勾选订单 → 选目标车队 → 一键分配（仅调度）
function openBatchFleet() {
  if (isFleet()) return; // 车队视图无分配权限
  const nos = getSelectedOrderNos();
  if (nos.length === 0) { alert('请先勾选要分配的订单'); return; }
  if (fleets.length === 0) { alert('暂无车队，请先在「车队管理」添加'); return; }
  document.getElementById('batchFleetInfo').textContent = `已勾选 ${nos.length} 条订单，选择目标车队：`;
  const opts = document.getElementById('batchFleetOptions');
  opts.innerHTML = fleets.map(f =>
    `<div class="opt" onclick="doBatchAssign('${escJs(f)}')">${esc(f)}</div>`
  ).join('') + `<div class="opt" style="color:#ff4d4f;" onclick="doBatchAssign('')">✕ 取消分配</div>`;
  document.getElementById('batchFleetOverlay').classList.add('show');
}

function closeBatchFleet() {
  document.getElementById('batchFleetOverlay').classList.remove('show');
}

// 执行批量分配（车队传空字符串 = 取消分配）
function doBatchAssign(fleet) {
  if (isFleet()) { closeBatchFleet(); return; } // 车队视图无分配权限
  const nos = getSelectedOrderNos();
  closeBatchFleet();
  if (nos.length === 0) return;
  getSupabase().from('orders').update({ '车队': fleet }).in('订单号', nos).then(({ error }) => {
    if (error) { alert('批量分配失败: ' + error.message); return; }
    loadOrders();
    showSuccess(fleet ? `${nos.length} 条订单已分配到 ${fleet}` : `${nos.length} 条订单已取消分配`);
  });
}

function clearOrders() {
  if (isFleet()) return; // 车队视图无清空权限
  if (!confirm('确定清空所有订单？此操作不可恢复。')) return;
  verifyPassword(async function(ok) {
    if (!ok) return;
    const { error } = await getSupabase().from('orders').delete().neq('订单号', '');
    if (error) { alert('清空失败: ' + error.message); return; }
    // 清除搜索词和筛选状态，避免新导入订单被旧条件过滤
    searchTerm = '';
    filterStatus = 'all';
    fleetFilter = 'all';
    currentPage = 1;
    document.getElementById('searchInput').value = '';
    document.getElementById('fleetFilter').value = 'all';
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', b.textContent.trim() === '全部');
    });
    loadOrders();
  });
}

// ============ 右键菜单 ============
let ctxOrderNo = null;

function showCtxMenu(e, orderNo) {
  e.preventDefault();
  ctxOrderNo = orderNo;
  const menu = document.getElementById('ctxMenu');
  menu.style.display = 'block';
  // 使用 clientX/clientY 适配 fixed 定位，并做边界检查防止超出视口
  const menuRect = menu.getBoundingClientRect();
  let left = e.clientX;
  let top = e.clientY;
  if (left + menuRect.width > window.innerWidth) {
    left = window.innerWidth - menuRect.width - 4;
  }
  if (top + menuRect.height > window.innerHeight) {
    top = window.innerHeight - menuRect.height - 4;
  }
  menu.style.left = Math.max(4, left) + 'px';
  menu.style.top = Math.max(4, top) + 'px';
}

function ctxDelete() {
  const orderNo = ctxOrderNo;
  hideCtxMenu();
  if (!orderNo) return;
  deleteOrder(orderNo);
}

// ============ 右键：复制订单 + 分配车队 ============
let ctxMenuHTML = ''; // 原始菜单内容缓存（子菜单返回用）

// 复制订单完整内容到剪贴板（键值对格式，与粘贴导入格式一致）
function ctxCopy() {
  const orderNo = ctxOrderNo;
  hideCtxMenu();
  if (!orderNo) return;
  const order = findOrderByNo(orderNo);
  if (!order) return;
  const text = COLUMNS.map(c => `${c}：${order[c] || ''}`).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    showSuccess('订单已复制到剪贴板');
  }).catch(() => {
    alert('复制失败，请手动复制：\n' + text);
  });
}

// 分配车队：菜单切换为车队子列表
function ctxAssignFleet() {
  if (isFleet()) { hideCtxMenu(); return; } // 车队视图无分配权限
  const menu = document.getElementById('ctxMenu');
  if (!ctxMenuHTML) ctxMenuHTML = menu.innerHTML;
  const order = ctxOrderNo ? findOrderByNo(ctxOrderNo) : null;
  const current = order ? (order['车队'] || '') : '';
  let html = fleets.map(f =>
    `<div class="ctx-item ctx-copy${f === current ? ' ctx-current' : ''}" onclick="doAssignFleet('${escJs(f)}')">${f === current ? '✓ ' : ''}${esc(f)}</div>`
  ).join('');
  if (html === '') html = '<div class="ctx-item" style="color:#999;cursor:default;">暂无车队，请先在「车队管理」添加</div>';
  if (current) html += `<div class="ctx-item ctx-copy" onclick="doAssignFleet('')">✕ 取消分配</div>`;
  html += '<div class="ctx-item" onclick="restoreCtxMenu()">← 返回</div>';
  menu.innerHTML = html;
}

// 恢复右键菜单原始内容
function restoreCtxMenu() {
  const menu = document.getElementById('ctxMenu');
  if (ctxMenuHTML) menu.innerHTML = ctxMenuHTML;
}

// 执行分配车队
function doAssignFleet(fleet) {
  if (isFleet()) { hideCtxMenu(); return; } // 车队视图无分配权限
  const orderNo = ctxOrderNo;
  hideCtxMenu();
  if (!orderNo) return;
  getSupabase().from('orders').update({ '车队': fleet }).eq('订单号', orderNo).then(({ error }) => {
    if (error) { alert('分配失败: ' + error.message); return; }
    loadOrders();
    showSuccess(fleet ? `订单 ${orderNo} 已分配到 ${fleet}` : `订单 ${orderNo} 已取消分配`);
  });
}

function hideCtxMenu() {
  document.getElementById('ctxMenu').style.display = 'none';
  ctxOrderNo = null;
}

document.addEventListener('click', function(e) {
  if (!document.getElementById('ctxMenu').contains(e.target)) {
    hideCtxMenu();
  }
});

// ============ 导出 ============
function exportCSV() {
  // 导出当前筛选+搜索的结果
  const exportData = getFilteredOrders();
  if (exportData.length === 0) { alert('没有可导出的订单'); return; }

  let csv = '\uFEFF' + COLUMNS.join(',') + '\n';
  exportData.forEach(o => {
    csv += COLUMNS.map(c => '"' + (o[c] || '').replace(/"/g, '""') + '"').join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `派单数据_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ============ 工具函数 ============
function esc(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML.replace(/"/g, '&quot;'); // innerHTML 不转义引号，需补上防止属性断裂
}

// onclick 等 JS 字符串参数专用：在 esc 基础上转义反斜杠和单引号，防止参数含 ' 时内联 JS 语法错误
function escJs(str) {
  return esc(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

// 点击空白关闭弹窗
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// 点击空白关闭车队管理弹窗
document.getElementById('fleetOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeFleetModal();
});

// ============ 浮动水平滚动条同步 ============
function syncHScroll() {
  const hscroll = document.getElementById('hscroll');
  const hscrollInner = document.getElementById('hscrollInner');
  const contentBody = document.getElementById('tableArea');
  if (!hscroll || !hscrollInner) return;
  if (!contentBody) { hscrollInner.style.width = '0px'; return; }
  const table = contentBody.querySelector('table');
  if (!table) { hscrollInner.style.width = '0px'; return; }
  hscrollInner.style.width = table.offsetWidth + 'px';
  hscroll.scrollLeft = contentBody.scrollLeft;
}

(function setupHScrollSync() {
  const hscroll = document.getElementById('hscroll');
  if (!hscroll) return;
  const contentBody = document.getElementById('tableArea');
  // 浮动滚动条 → 同步表格水平滚动
  hscroll.addEventListener('scroll', () => {
    if (contentBody) contentBody.scrollLeft = hscroll.scrollLeft;
  });
  // 表格水平滚动 → 同步浮动滚动条（触控板/Shift+滚轮场景）
  document.addEventListener('scroll', (e) => {
    const target = e.target;
    if (target && target.id === 'tableArea') {
      hscroll.scrollLeft = target.scrollLeft;
    }
  }, true);
  // 窗口大小变化时重新同步
  window.addEventListener('resize', syncHScroll);
})();

// 移动端长按订单行 500ms 弹出右键菜单（兼容 iOS/Android）
(function setupLongPress() {
  const container = document.getElementById('tableArea');
  let longPressTimer = null;
  let longPressTriggered = false;

  container.addEventListener('touchstart', (e) => {
    const tr = e.target.closest('tr[data-no]');
    if (!tr) return;
    const orderNo = tr.getAttribute('data-no');
    if (!orderNo) return;
    longPressTriggered = false;
    longPressTimer = setTimeout(() => {
      longPressTriggered = true;
      const touch = e.touches[0];
      showCtxMenu({
        preventDefault: () => {},
        clientX: touch.clientX,
        clientY: touch.clientY
      }, orderNo);
      if (navigator.vibrate) navigator.vibrate(50); // 震动反馈
    }, 500);
  }, { passive: true });

  container.addEventListener('touchend', (e) => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    if (longPressTriggered) e.preventDefault(); // 阻止后续 click，避免触发编辑
  });

  container.addEventListener('touchmove', () => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  }, { passive: true });
})();

// 初始化：加载车队列表（自动填充筛选/导入下拉框）
loadFleets();

// 初始化：加载数据 + 开启实时同步
loadOrders();
setupRealtime();

// 测试页跨标签页同步：其他标签页写 localStorage 时本页收到 storage 事件（模拟 Realtime）
// 场景：车队标签页填写司机信息 → 管理员标签页自动刷新看到
window.addEventListener('storage', e => {
  if (![DB_KEY, FLEET_KEY, PW_KEY, SEQ_KEY].includes(e.key)) return;
  testDB = loadJSON(DB_KEY, testDB);
  testFleets = loadJSON(FLEET_KEY, testFleets);
  testFleetPws = loadJSON(PW_KEY, testFleetPws);
  testNextId = Number(loadJSON(SEQ_KEY, testNextId)) || testNextId;
  if (isEditing) return; // 编辑中不刷新，避免丢失输入（与 Realtime 同规则）
  loadOrders();
  loadFleets();
});

// 阶段2：恢复上次登录身份（无会话则显示身份入口）
restoreSession();
</script>
