name: 单元测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 车队密码流程测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 语法检查测试代码
        run: node --check tests/run_fleet_tests.js

      - name: 运行测试
        run: node tests/run_fleet_tests.js
